<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertidor DOCX → Juego completo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#2c2c2e; --text:#ececec; --muted:rgba(236,236,236,0.4); }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .container { width:100%; max-width:560px; }
    .drop-zone { border:1.5px dashed rgba(255,255,255,0.18); border-radius:20px; padding:80px 40px; text-align:center; cursor:pointer; transition:border-color .25s,background .25s; background:transparent; }
    .drop-zone.dragover { border-color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.04); }
    .drop-icon { font-size:3.2em; display:block; margin-bottom:20px; transition:transform .3s; line-height:1; }
    .drop-zone.dragover .drop-icon { transform:scale(1.12) translateY(-4px); }
    .drop-label { font-size:.9em; font-weight:300; color:var(--muted); letter-spacing:.02em; }
    #fileInput { display:none; }
    .prompt-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); z-index:100; align-items:center; justify-content:center; }
    .prompt-overlay.active { display:flex; }
    .prompt-box { background:#3a3a3c; border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:36px 32px; width:100%; max-width:380px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.4); }
    .prompt-box p { font-size:.85em; font-weight:300; color:var(--muted); margin-bottom:18px; letter-spacing:.02em; }
    .prompt-box input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:12px 16px; font-family:'Inter',sans-serif; font-size:.95em; color:var(--text); outline:none; transition:border-color .2s; margin-bottom:20px; }
    .prompt-box input:focus { border-color:rgba(255,255,255,.35); }
    .prompt-box input::placeholder { color:rgba(255,255,255,.25); }
    .btn-confirm { width:100%; padding:11px; background:rgba(255,255,255,.9); border:none; border-radius:10px; color:#2c2c2e; font-family:'Inter',sans-serif; font-size:.85em; font-weight:500; cursor:pointer; transition:background .2s; }
    .btn-confirm:hover { background:#fff; }
    .gears-overlay { display:none; position:fixed; inset:0; background:rgba(28,28,30,.96); backdrop-filter:blur(12px); z-index:200; flex-direction:column; align-items:center; justify-content:center; gap:32px; }
    .gears-overlay.active { display:flex; }
    .gears-wrap { position:relative; width:210px; height:170px; }
    .gear-svg { position:absolute; overflow:visible; }
    .gear-svg.big { width:140px; height:140px; bottom:0; left:0; animation:spin-cw 4s linear infinite; transform-origin:center center; }
    .gear-svg.small { width:90px; height:90px; top:0; right:0; animation:spin-ccw 2.545s linear infinite; transform-origin:center center; }
    .gear-body { fill:none; stroke:rgba(255,255,255,.18); stroke-width:1.5; }
    .gear-ring { fill:none; stroke:rgba(255,255,255,.55); stroke-width:2; }
    .gear-hole { fill:rgba(255,255,255,.08); stroke:rgba(255,255,255,.3); stroke-width:1.5; }
    @keyframes spin-cw  { to { transform:rotate(360deg);  } }
    @keyframes spin-ccw { to { transform:rotate(-360deg); } }
    .gears-label { font-size:.78em; font-weight:300; color:rgba(255,255,255,.35); letter-spacing:.14em; text-transform:uppercase; text-align:center; }
    .progress-wrap { width:240px; display:none; flex-direction:column; align-items:center; gap:10px; }
    .progress-track { width:100%; height:3px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; width:0%; background:rgba(255,255,255,.5); border-radius:2px; transition:width .4s ease; }
    .progress-text { font-size:.72em; font-weight:300; color:rgba(255,255,255,.25); letter-spacing:.08em; }
    .error-box { margin-top:20px; background:rgba(255,80,80,.08); border:1px solid rgba(255,80,80,.2); border-radius:12px; padding:14px 18px; color:#ff8080; font-size:.85em; font-weight:300; display:none; }
    #status { display:none; }
  </style>
</head>
<body>

<div class="prompt-overlay" id="promptOverlay">
  <div class="prompt-box">
    <p>Nombre de la carpeta del juego</p>
    <input type="text" id="promptInput" placeholder="Mi Juego" value="Mi Juego" />
    <button class="btn-confirm" id="promptConfirm">Crear juego</button>
  </div>
</div>

<div class="gears-overlay" id="gearsOverlay">
  <div class="gears-wrap">
    <svg class="gear-svg big" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <path class="gear-body" d="M 65.43,24.23 L 65.69,8.15 L 74.31,8.15 L 74.57,24.23 L 88.93,28.08 L 97.19,14.28 L 104.66,18.59 L 96.84,32.64 L 107.36,43.16 L 121.41,35.34 L 125.72,42.81 L 111.92,51.07 L 115.77,65.43 L 131.85,65.69 L 131.85,74.31 L 115.77,74.57 L 111.92,88.93 L 125.72,97.19 L 121.41,104.66 L 107.36,96.84 L 96.84,107.36 L 104.66,121.41 L 97.19,125.72 L 88.93,111.92 L 74.57,115.77 L 74.31,131.85 L 65.69,131.85 L 65.43,115.77 L 51.07,111.92 L 42.81,125.72 L 35.34,121.41 L 43.16,107.36 L 32.64,96.84 L 18.59,104.66 L 14.28,97.19 L 28.08,88.93 L 24.23,74.57 L 8.15,74.31 L 8.15,65.69 L 24.23,65.43 L 28.08,51.07 L 14.28,42.81 L 18.59,35.34 L 32.64,43.16 L 43.16,32.64 L 35.34,18.59 L 42.81,14.28 L 51.07,28.08 Z"/>
      <circle class="gear-ring" cx="70" cy="70" r="36"/>
      <circle class="gear-hole" cx="70" cy="70" r="13"/>
    </svg>
    <svg class="gear-svg small" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
      <path class="gear-body" d="M 40.69,16.32 L 40.83,5.22 L 49.17,5.22 L 49.31,16.32 L 62.23,21.67 L 70.18,13.92 L 76.08,19.82 L 68.33,27.77 L 73.68,40.69 L 84.78,40.83 L 84.78,49.17 L 73.68,49.31 L 68.33,62.23 L 76.08,70.18 L 70.18,76.08 L 62.23,68.33 L 49.31,73.68 L 49.17,84.78 L 40.83,84.78 L 40.69,73.68 L 27.77,68.33 L 19.82,76.08 L 13.92,70.18 L 21.67,62.23 L 16.32,49.31 L 5.22,49.17 L 5.22,40.83 L 16.32,40.69 L 21.67,27.77 L 13.92,19.82 L 19.82,13.92 L 27.77,21.67 Z"/>
      <circle class="gear-ring" cx="45" cy="45" r="23"/>
      <circle class="gear-hole" cx="45" cy="45" r="9"/>
    </svg>
  </div>
  <span class="gears-label" id="gearsLabel">Fabricando tu juego</span>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText"></span>
  </div>
</div>

<div class="container">
  <div class="drop-zone" id="dropZone">
    <span class="drop-icon">📄</span>
    <div class="drop-label">Arrastra tu documento aquí</div>
    <input type="file" id="fileInput" accept=".docx">
  </div>
  <div id="status"></div>
  <div class="error-box" id="errorBox"></div>
</div>

<script>
// =============================================================
// ARCHIVOS BASE
// =============================================================
const ARCHIVOS_BASE = [
  'flip.mp3','ganador.MP3','baile.gif',
  'cartaaleatira.html','cartaordenada.html','claud6.html',
  'index.html','palabraborrosa.html','pro.html','audio.html','test.html'
];

// =============================================================
// DRAG & DROP
// =============================================================
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
let preguntasGeneradas = [];

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.docx')) processFile(f);
  else showError('Por favor arrastra un archivo .docx válido.');
});

// =============================================================
// UI
// =============================================================
function showError(m){ const b=document.getElementById('errorBox'); b.textContent='⚠ '+m; b.style.display='block'; }
function hideError() { document.getElementById('errorBox').style.display='none'; }
function showGears() { document.getElementById('gearsOverlay').classList.add('active'); }
function hideGears() { document.getElementById('gearsOverlay').classList.remove('active'); setLabel('Fabricando tu juego'); document.getElementById('progressWrap').style.display='none'; }
function setLabel(t) { document.getElementById('gearsLabel').textContent=t; }
function setProgress(c,t,l){ const w=document.getElementById('progressWrap'); w.style.display='flex'; document.getElementById('progressFill').style.width=Math.round(c/t*100)+'%'; document.getElementById('progressText').textContent=l||c+'/'+t; }

function showPrompt(def){
  return new Promise(resolve=>{
    const ov=document.getElementById('promptOverlay'),inp=document.getElementById('promptInput'),btn=document.getElementById('promptConfirm');
    inp.value=def||'Mi Juego'; ov.classList.add('active'); setTimeout(()=>{inp.focus();inp.select();},60);
    function ok(){ cleanup(); resolve(inp.value.trim()||'Mi Juego'); }
    function onKey(e){ if(e.key==='Enter') ok(); }
    function cleanup(){ ov.classList.remove('active'); btn.removeEventListener('click',ok); inp.removeEventListener('keydown',onKey); }
    btn.addEventListener('click',ok); inp.addEventListener('keydown',onKey);
  });
}

const delay = ms => new Promise(r=>setTimeout(r,ms));

// =============================================================
// PROCESAR DOCX
// =============================================================
async function processFile(file){
  hideError(); showGears();
  try {
    const ab  = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(ab);
    const xml = await zip.file('word/document.xml').async('string');
    const preguntas = parsearPreguntas(xml);

    if (!preguntas.length){ hideGears(); showError('No se detectaron preguntas válidas.'); return; }

    await delay(500);
    setLabel('Generando respuestas incorrectas…');
    setProgress(0, preguntas.length, 'Preparando…');

    // ── PASO 1: intentar con la API de Anthropic (funciona si se abre como Artifact en Claude) ──
    let usandoIA = false;
    try {
      const test = await callAnthropicAPI([preguntas[0]], 8000);
      if (test && test[0] && test[0].respuesta_incorrecta1) {
        usandoIA = true;
      }
    } catch(_){}

    if (usandoIA) {
      setLabel('IA generando respuestas incorrectas…');
      preguntasGeneradas = await generarConIA(preguntas);
    } else {
      // ── PASO 2: generación local garantizada ──
      setLabel('Generando respuestas incorrectas…');
      preguntasGeneradas = generarLocal(preguntas);
    }

    setProgress(preguntas.length, preguntas.length, 'Listo ✓');
    await delay(400);
    hideGears();

    const nombre = await showPrompt('Mi Juego');
    if (!nombre) return;
    showGears(); setLabel('Empaquetando el juego…');
    await descargarJuegoCompleto(nombre);

  } catch(err){ hideGears(); showError('Error: '+err.message); }
}

// =============================================================
// MÉTODO 1 — API ANTHROPIC (solo funciona como Artifact en Claude)
// =============================================================
async function callAnthropicAPI(lote, timeout=15000){
  const lista = lote.map((p,i)=>`${i+1}. Pregunta: ${p.pregunta}\n   Respuesta correcta: ${p.respuesta}`).join('\n\n');
  const system = `Eres un generador de respuestas incorrectas para juegos tipo test.
Para cada pregunta con su respuesta correcta, inventa DOS respuestas incorrectas plausibles del mismo tema.
Responde ÚNICAMENTE con un array JSON. Sin backticks. Sin texto extra. Formato:
[{"respuesta_incorrecta1":"...","respuesta_incorrecta2":"..."}]
El array debe tener exactamente ${lote.length} elemento(s).`;

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeout);

  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', signal:controller.signal,
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system, messages:[{role:'user',content:lista}] })
  });
  clearTimeout(timer);

  if (!res.ok){ const e=await res.json().catch(()=>{}); throw new Error(e?.error?.message||'HTTP '+res.status); }
  const data = await res.json();
  const texto = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  const limpio = texto.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
  const parsed = JSON.parse(limpio);
  if (!Array.isArray(parsed)||parsed.length!==lote.length) throw new Error('Array de tamaño incorrecto');
  return lote.map((p,i)=>({...p, respuesta_incorrecta1:(parsed[i].respuesta_incorrecta1||'').trim(), respuesta_incorrecta2:(parsed[i].respuesta_incorrecta2||'').trim()}));
}

async function generarConIA(preguntas){
  const LOTE=10; const resultado=[];
  for(let i=0;i<preguntas.length;i+=LOTE){
    const lote=preguntas.slice(i,i+LOTE);
    setProgress(i,preguntas.length,`Preguntas ${i+1}–${Math.min(i+LOTE,preguntas.length)} de ${preguntas.length}`);
    try {
      const res = await callAnthropicAPI(lote);
      resultado.push(...res);
    } catch(err){
      console.warn('Lote IA falló, usando local:', err.message);
      resultado.push(...generarLocal(lote, preguntas));
    }
  }
  return resultado;
}

// =============================================================
// MÉTODO 2 — GENERACIÓN LOCAL GARANTIZADA (sin internet)
//
// Estrategia: para cada pregunta tomamos las respuestas de OTRAS
// preguntas del mismo documento como distractores. Si hay pocas
// preguntas, mutamos la respuesta correcta cambiando palabras clave
// por antónimos, números alterados o palabras del mismo campo semántico.
// =============================================================
function generarLocal(preguntas, todasPreguntas){
  const pool = todasPreguntas || preguntas; // pool de respuestas disponibles

  return preguntas.map((p, idx) => {
    // Candidatos: respuestas de otras preguntas del pool
    const candidatos = pool
      .filter((_,i) => pool[i].respuesta !== p.respuesta)
      .map(o => o.respuesta);

    // Elegir 2 candidatos distintos; si no hay suficientes, mutar la respuesta correcta
    const elegidos = [];
    const usados = new Set();
    usados.add(normalizar(p.respuesta));

    // Barajar candidatos aleatoriamente (semilla basada en el índice para reproducibilidad)
    const barajados = [...candidatos].sort(()=> Math.sin(idx*9999+candidatos.length)*10000 % 1 - 0.5);

    for (const c of barajados) {
      const n = normalizar(c);
      if (!usados.has(n) && elegidos.length < 2) {
        elegidos.push(c);
        usados.add(n);
      }
    }

    // Si todavía faltan, generamos mutaciones de la respuesta correcta
    while (elegidos.length < 2) {
      const mutacion = mutarRespuesta(p.respuesta, elegidos.length, p.pregunta);
      const n = normalizar(mutacion);
      if (!usados.has(n)) { elegidos.push(mutacion); usados.add(n); }
      else { elegidos.push(mutacion + ' (variante)'); break; } // fallback extremo
    }

    return { ...p, respuesta_incorrecta1: elegidos[0], respuesta_incorrecta2: elegidos[1] };
  });
}

// Normaliza para comparar (sin tildes, minúsculas, sin espacios extra)
function normalizar(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}

// Muta una respuesta para que sea plausible pero incorrecta
function mutarRespuesta(respuesta, variante, pregunta){
  const palabras = respuesta.split(/\s+/);

  // Diccionario de sustituciones comunes
  const sust = {
    'primero':'segundo','segundo':'tercero','tercero':'primero',
    'primera':'segunda','segunda':'tercera','tercera':'primera',
    'grande':'pequeño','pequeño':'grande','alto':'bajo','bajo':'alto',
    'norte':'sur','sur':'norte','este':'oeste','oeste':'este',
    'antes':'después','después':'antes','inicio':'final','final':'inicio',
    'mayor':'menor','menor':'mayor','más':'menos','menos':'más',
    'positivo':'negativo','negativo':'positivo',
    'rápido':'lento','lento':'rápido','caliente':'frío','frío':'caliente',
    'blanco':'negro','negro':'blanco','día':'noche','noche':'día',
    'verdadero':'falso','falso':'verdadero','público':'privado','privado':'público',
    'activo':'pasivo','pasivo':'activo','entrada':'salida','salida':'entrada',
  };

  // Buscar palabras sustituibles
  const nuevas = [...palabras];
  let sustituido = false;
  for (let i=0; i<nuevas.length; i++){
    const k = nuevas[i].toLowerCase().replace(/[.,;:!?]/g,'');
    if (sust[k]) {
      const sufijo = nuevas[i].slice(k.length);
      const reemplazo = variante===0 ? sust[k] : (sust[sust[k]]||sust[k]+'s');
      nuevas[i] = reemplazo + sufijo;
      sustituido = true;
      break;
    }
  }

  if (sustituido) return nuevas.join(' ');

  // Si no hay sustitución directa: rotar palabras dentro de la respuesta
  if (palabras.length >= 3) {
    const copia = [...palabras];
    if (variante === 0) {
      // Intercambiar primera y última palabra significativa
      const tmp = copia[0]; copia[0] = copia[copia.length-1]; copia[copia.length-1] = tmp;
    } else {
      // Insertar un modificador al principio
      const mods = ['No','Casi','Principalmente','Básicamente','Generalmente'];
      const mod = mods[palabras.length % mods.length];
      copia.unshift(mod);
    }
    return copia.join(' ');
  }

  // Para respuestas muy cortas: añadir un modificador numérico o de negación
  const prefijos = ['No es ', 'Tampoco ', 'Ni el ', 'Antes del '];
  return prefijos[variante % prefijos.length] + respuesta.toLowerCase();
}

// =============================================================
// PARSER XML — igual que el original
// =============================================================
function parsearPreguntas(xmlStr){
  const parser=new DOMParser();
  const xmlDoc=parser.parseFromString(xmlStr,'application/xml');
  const NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const wParrafos=Array.from(xmlDoc.getElementsByTagNameNS(NS,'p'));

  function analizarParrafo(wp){
    const runs=Array.from(wp.getElementsByTagNameNS(NS,'r'));
    let texto=[],sub=[];
    for(const run of runs){
      const rPr=run.getElementsByTagNameNS(NS,'rPr')[0];
      const uEl=rPr?rPr.getElementsByTagNameNS(NS,'u')[0]:null;
      const esSub=uEl&&uEl.getAttributeNS(NS,'val')!=='none'&&uEl.getAttribute('w:val')!=='none';
      for(const t of run.getElementsByTagNameNS(NS,'t')){
        texto.push(t.textContent);
        if(esSub) t.textContent.split(/\s+/).filter(w=>w.length>0).forEach(w=>sub.push(w));
      }
    }
    return {texto:texto.join('').trim(), subrayadas:sub};
  }

  const preguntas=[];
  let modoPregunta=false,modoRespuesta=false;
  let pActual=[],rActual=[],sActuales=[];
  const esPregunta  = t=>/^PREGUNTA\s*$/i.test(t);
  const esRespuesta = t=>/^RESPUESTA[S]?\s*:?\s*$/i.test(t)||/^Respuesta\s*:?\s*$/i.test(t);

  for(const wp of wParrafos){
    const {texto,subrayadas}=analizarParrafo(wp);
    if(esPregunta(texto)){
      if(pActual.length&&rActual.length) preguntas.push(crearEntrada(pActual.join(' '),rActual.join(' '),sActuales));
      pActual=[];rActual=[];sActuales=[];modoPregunta=true;modoRespuesta=false;continue;
    }
    if(esRespuesta(texto)){modoPregunta=false;modoRespuesta=true;continue;}
    if(modoPregunta){if(texto)pActual.push(texto);}
    else if(modoRespuesta){if(texto)rActual.push(texto);sActuales.push(...subrayadas);}
  }
  if(pActual.length&&rActual.length) preguntas.push(crearEntrada(pActual.join(' '),rActual.join(' '),sActuales));
  return preguntas;
}

function crearEntrada(pregunta,respuesta,subrayadas){
  const unicas=[...new Set(subrayadas.map(w=>w.toLowerCase()))];
  return {pregunta:pregunta.trim(),respuesta:respuesta.trim(),palabrasclave:unicas.join(',')};
}

// =============================================================
// GENERAR preguntas.js
// =============================================================
function generarPreguntasJS(preguntas,titulo){
  const entries=preguntas.map(p=>`
  {
    pregunta: ${JSON.stringify(p.pregunta)},
    respuesta: ${JSON.stringify(p.respuesta)},
    palabrasclave: ${JSON.stringify(p.palabrasclave)},
    respuesta_incorrecta1: ${JSON.stringify(p.respuesta_incorrecta1||'')},
    respuesta_incorrecta2: ${JSON.stringify(p.respuesta_incorrecta2||'')}
  }`).join(',');
  return `const titulo_del_juego = ${JSON.stringify(titulo)};\n\nconst preguntas = [\n${entries}\n];`;
}

// =============================================================
// DESCARGAR ZIP
// =============================================================
async function descargarJuegoCompleto(nombreJuego){
  try {
    const zip=new JSZip();
    const carpeta=zip.folder(nombreJuego);
    carpeta.file('preguntas.js',generarPreguntasJS(preguntasGeneradas,nombreJuego));
    for(const archivo of ARCHIVOS_BASE){
      const r=await fetch(archivo);
      if(!r.ok) throw new Error('No se encontró: '+archivo);
      carpeta.file(archivo,await r.blob());
    }
    const [blob]=await Promise.all([zip.generateAsync({type:'blob'}),delay(1500)]);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=nombreJuego+'.zip';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    hideGears();fileInput.value='';preguntasGeneradas=[];
  } catch(err){ hideGears(); showError(err.message); }
}
</script>
