<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repaso de Diseño Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="preguntas.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [data-theme="light"] {
      --bg:         #f2f2f0;
      --surface:    #ffffff;
      --border:     #e8e6e0;
      --text:       #111110;
      --muted:      #9a9690;
      --active-bg:  #111110;
      --active-txt: #f2f2f0;
      --dot-on:     #5fbd8a;
      --btn-hover:  #f0ede7;
      --icon:       #444340;
    }

    [data-theme="dark"] {
      --bg:         #0f0f0e;
      --surface:    #1a1a19;
      --border:     #2a2a28;
      --text:       #f0efe9;
      --muted:      #6b6860;
      --active-bg:  #f0efe9;
      --active-txt: #111110;
      --dot-on:     #5fbd8a;
      --btn-hover:  #242422;
      --icon:       #c8c6bf;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      transition: background 0.25s, color 0.25s;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      transition: background 0.25s, border-color 0.25s;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .theme-btn:hover { background: var(--btn-hover); }
    .theme-btn svg { width: 15px; height: 15px; stroke: var(--icon); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .playlist-label {
      padding: 14px 20px 6px;
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .playlist {
      max-height: 244px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .playlist::-webkit-scrollbar { width: 3px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .playlist-item {
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 13px;
      border-top: 1px solid var(--border);
      transition: background 0.12s;
    }
    .playlist-item:first-child { border-top: none; }
    .playlist-item:hover { background: var(--btn-hover); }
    .playlist-item.selected { background: var(--active-bg); color: var(--active-txt); }
    .playlist-item.selected .item-num,
    .playlist-item.selected .item-keyword { opacity: 0.38; }

    .item-num {
      font-size: 0.67rem;
      color: var(--muted);
      min-width: 16px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .item-content { flex: 1; min-width: 0; }
    .item-question {
      font-size: 0.84rem;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-keyword { font-size: 0.67rem; color: var(--muted); margin-top: 2px; }

    .item-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
      transition: background 0.25s;
    }
    .playlist-item.playing .item-dot {
      background: var(--dot-on);
      animation: pulse 1.3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.65); }
    }

    .controls {
      padding: 18px 20px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .ctrl {
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.13s, border-color 0.13s, transform 0.1s;
      flex-shrink: 0;
    }
    .ctrl:hover { background: var(--btn-hover); }
    .ctrl:active { transform: scale(0.91); }

    .ctrl.sm { width: 36px; height: 36px; }
    .ctrl.md { width: 42px; height: 42px; }
    .ctrl.lg { width: 50px; height: 50px; }

    .ctrl.primary {
      background: var(--active-bg);
      border-color: var(--active-bg);
    }
    .ctrl.primary:hover { opacity: 0.82; background: var(--active-bg); }

    .ctrl.ghost { border-color: transparent; }
    .ctrl.ghost:hover { background: var(--btn-hover); border-color: var(--border); }

    .ctrl svg {
      display: block;
      fill: none;
      stroke: var(--icon);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ctrl.primary svg { stroke: var(--active-txt); }
    .ctrl svg.sq { fill: var(--icon); stroke: none; }
    .ctrl.primary svg.sq { fill: var(--active-txt); stroke: none; }

    @media (max-width: 380px) {
      .ctrl.lg { width: 44px; height: 44px; }
      .ctrl.md { width: 38px; height: 38px; }
      .ctrl.sm { width: 32px; height: 32px; }
      .controls { gap: 6px; }
    }
  </style>
</head>
<body>
<div class="card">

  <div class="topbar">
    <h1 id="game-title">Cargando…</h1>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Modo oscuro">
      <svg id="theme-icon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
      </svg>
    </button>
  </div>

  <div class="playlist-label">Playlist</div>
  <div class="playlist" id="playlist"></div>

  <div class="controls">

    <!-- Reproducir todo -->
    <button class="ctrl sm" onclick="reproducirTodo()" aria-label="Reproducir todo">
      <svg width="16" height="16" viewBox="0 0 24 24">
        <polygon points="5,3 19,12 5,21"/>
        <line x1="19" y1="3" x2="19" y2="21"/>
      </svg>
    </button>

    <!-- Anterior -->
    <button class="ctrl md" onclick="anterior()" aria-label="Anterior">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <polygon points="19,20 9,12 19,4"/>
        <line x1="5" y1="4" x2="5" y2="20"/>
      </svg>
    </button>

    <!-- Play (principal) -->
    <button class="ctrl lg primary" id="btn-play" onclick="playBucle()" aria-label="Play">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
    </button>

    <!-- Siguiente -->
    <button class="ctrl md" onclick="siguiente()" aria-label="Siguiente">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <polygon points="5,4 15,12 5,20"/>
        <line x1="19" y1="4" x2="19" y2="20"/>
      </svg>
    </button>

    <!-- Stop -->
    <button class="ctrl sm" onclick="stop()" aria-label="Stop">
      <svg width="16" height="16" viewBox="0 0 24 24">
        <rect class="sq" x="4" y="4" width="16" height="16" rx="2"/>
      </svg>
    </button>

    <!-- Salir -->
    <button class="ctrl sm ghost" onclick="salir()" aria-label="Salir" style="margin-left:4px;">
      <svg width="15" height="15" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>

  </div>
</div>

<script>
  let selectedIndex = -1;
  let vocesCargadas = false;
  let vozMasculina = null;
  let vozFemenina  = null;
  let sessionToken = 0;

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('game-title').textContent = titulo_del_juego.toUpperCase();
    renderPlaylist();
    cargarVoces();
    window.speechSynthesis.onvoiceschanged = cargarVoces;
  });

  function cargarVoces() {
    const voces = window.speechSynthesis.getVoices();
    if (!voces.length) return;
    const esVoces = voces.filter(v => v.lang.startsWith('es'));
    const base = esVoces.length ? esVoces : voces;
    vozMasculina = base.find(v => /male|hombre|jorge|diego|miguel|juan|carlos|pablo|alvaro|enrique/i.test(v.name)) || base[0];
    vozFemenina  = base.find(v => /female|mujer|lucia|maria|elena|laura|pilar|conchita|sabina|monica|paula/i.test(v.name) && v !== vozMasculina)
                || base.find(v => v !== vozMasculina) || base[0];
    vocesCargadas = true;
  }

  function renderPlaylist() {
    const lista = document.getElementById('playlist');
    lista.innerHTML = '';
    preguntas.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'playlist-item';
      item.id = `item-${i}`;
      item.innerHTML = `
        <span class="item-num">${i + 1}</span>
        <div class="item-content">
          <div class="item-question">${p.pregunta}</div>
          <div class="item-keyword">${p.palabrasclave}</div>
        </div>
        <span class="item-dot"></span>`;
      item.addEventListener('click', () => { seleccionar(i); playBucle(); });
      lista.appendChild(item);
    });
  }

  function seleccionar(i) {
    document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('selected'));
    selectedIndex = i;
    const el = document.getElementById(`item-${i}`);
    if (el) { el.classList.add('selected'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  function marcarReproduciendo(i, state) {
    document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('playing'));
    if (state && i >= 0) document.getElementById(`item-${i}`)?.classList.add('playing');
  }

  function hablar(texto, masculino, token) {
    return new Promise((resolve) => {
      if (token !== sessionToken) { resolve(); return; }
      window.speechSynthesis.cancel();
      setTimeout(() => {
        if (token !== sessionToken) { resolve(); return; }
        const utt = new SpeechSynthesisUtterance(texto);
        utt.lang   = 'es-ES';
        utt.rate   = 0.92;
        utt.pitch  = masculino ? 0.7 : 1.25;
        utt.volume = 1;
        if (vocesCargadas) utt.voice = masculino ? vozMasculina : vozFemenina;
        utt.onend   = () => { if (token === sessionToken) resolve(); };
        utt.onerror = () => resolve();
        window.speechSynthesis.speak(utt);
      }, 80);
    });
  }

  async function leerPreguntaRespuesta(i, token) {
    const p = preguntas[i];
    await hablar(p.pregunta, true, token);
    if (token !== sessionToken) return;
    await hablar(p.respuesta, false, token);
  }

  async function playBucle() {
    if (selectedIndex < 0) seleccionar(0);
    const token = ++sessionToken;
    window.speechSynthesis.cancel();
    marcarReproduciendo(selectedIndex, true);
    while (token === sessionToken) {
      await leerPreguntaRespuesta(selectedIndex, token);
    }
    if (token === sessionToken) marcarReproduciendo(selectedIndex, false);
  }

  async function reproducirTodo() {
    seleccionar(0);
    const token = ++sessionToken;
    window.speechSynthesis.cancel();
    for (let i = 0; i < preguntas.length; i++) {
      if (token !== sessionToken) break;
      seleccionar(i);
      marcarReproduciendo(i, true);
      await leerPreguntaRespuesta(i, token);
    }
    if (token !== sessionToken) return;
    marcarReproduciendo(selectedIndex, false);
  }

  function stop() {
    sessionToken++;
    window.speechSynthesis.cancel();
    marcarReproduciendo(-1, false);
  }

  function anterior() {
    const i = selectedIndex <= 0 ? preguntas.length - 1 : selectedIndex - 1;
    seleccionar(i); playBucle();
  }

  function siguiente() {
    const i = selectedIndex >= preguntas.length - 1 ? 0 : selectedIndex + 1;
    seleccionar(i); playBucle();
  }

  function salir() { stop(); location.reload(); }

  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    updateIcon(!isDark);
  }

  function updateIcon(isDark) {
    const icon = document.getElementById('theme-icon');
    icon.innerHTML = isDark
      ? `<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`
      : `<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>`;
  }
</script>
</body>
</html>
