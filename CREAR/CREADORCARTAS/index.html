<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertidor DOCX → preguntas.js</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8ff00;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #666;
      --card: #1a1a1a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.7em;
      letter-spacing: 3px;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(1.6em, 5vw, 2.6em);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95em;
      font-weight: 300;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }

    .drop-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(200,255,0,0.05) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: #1a1f0d;
    }

    .drop-zone.dragover::before {
      opacity: 1;
    }

    .drop-icon {
      font-size: 3.5em;
      margin-bottom: 16px;
      display: block;
      transition: transform 0.3s;
    }

    .drop-zone.dragover .drop-icon {
      transform: scale(1.15) translateY(-4px);
    }

    .drop-title {
      font-family: 'Space Mono', monospace;
      font-size: 1.1em;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .drop-subtitle {
      color: var(--muted);
      font-size: 0.9em;
    }

    .drop-subtitle strong {
      color: var(--accent);
      font-weight: 600;
    }

    #fileInput { display: none; }

    /* Estado / Progreso */
    #status {
      margin-top: 24px;
      display: none;
    }

    .status-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.85em;
      color: var(--accent);
    }

    .progress-bar-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Resultado */
    #result {
      margin-top: 24px;
      display: none;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .result-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.9em;
      color: var(--muted);
    }

    .result-count {
      font-family: 'Space Mono', monospace;
      font-size: 1.1em;
      color: var(--accent);
      font-weight: 700;
    }

    /* Lista de preguntas detectadas */
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 20px;
    }

    .questions-list::-webkit-scrollbar { width: 4px; }
    .questions-list::-webkit-scrollbar-track { background: transparent; }
    .questions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.2s;
      animation: fadeUp 0.3s ease both;
    }

    .q-card:hover { border-color: #3a3a3a; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .q-num {
      font-family: 'Space Mono', monospace;
      font-size: 0.7em;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 0.9em;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .q-keywords {
      font-size: 0.78em;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .q-keywords span {
      display: inline-block;
      background: rgba(200,255,0,0.08);
      color: var(--accent);
      border-radius: 3px;
      padding: 1px 6px;
      margin: 2px 2px 0 0;
      font-size: 0.9em;
    }

    /* Botón descarga */
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 1em;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .download-btn:hover {
      background: #d4ff1a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,255,0,0.2);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .download-btn .icon { font-size: 1.2em; }

    /* Reset */
    .reset-btn {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 24px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* Error */
    .error-box {
      background: #1a0d0d;
      border: 1px solid #4a1a1a;
      border-radius: 10px;
      padding: 16px 20px;
      color: #ff6b6b;
      font-size: 0.9em;
      margin-top: 16px;
      display: none;
    }

    /* Pie */
    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8em;
      font-family: 'Space Mono', monospace;
    }

    footer span { color: var(--accent); }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="badge">Herramienta de estudio</div>
    <h1>DOCX <span>→</span> preguntas.js</h1>
    <p class="subtitle">Arrastra tu Word de preguntas y genera el archivo listo para usar</p>
  </header>

  <!-- Zona de arrastre -->
  <div class="drop-zone" id="dropZone">
    <span class="drop-icon">📄</span>
    <div class="drop-title">Arrastra tu archivo .docx aquí</div>
    <div class="drop-subtitle">o haz clic para seleccionarlo · Solo archivos <strong>.docx</strong></div>
    <input type="file" id="fileInput" accept=".docx">
  </div>

  <!-- Estado -->
  <div id="status">
    <div class="status-box">
      <div class="status-header">
        <div class="spinner"></div>
        <div class="status-label" id="statusLabel">Leyendo documento...</div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Resultado -->
  <div id="result">
    <div class="result-header">
      <div class="result-title">Preguntas detectadas</div>
      <div class="result-count" id="countLabel">0 preguntas</div>
    </div>
    <div class="questions-list" id="questionsList"></div>
    <button class="download-btn" id="downloadBtn">
      <span class="icon">⬇</span> Descargar preguntas.js
    </button>
    <button class="reset-btn" id="resetBtn">Convertir otro archivo</button>
  </div>

</div>

<footer>Convierte · Descarga · Juega con <span>index.html</span></footer>

<script>
// ───────── Drag & Drop ─────────
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.docx')) {
    processFile(file);
  } else {
    showError('Por favor arrastra un archivo .docx válido.');
  }
});

// ───────── Estado UI ─────────
function setStatus(label, progress) {
  document.getElementById('status').style.display = 'block';
  document.getElementById('statusLabel').textContent = label;
  document.getElementById('progressBar').style.width = progress + '%';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
  document.getElementById('status').style.display = 'none';
}

function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

// ───────── Procesar archivo ─────────
async function processFile(file) {
  hideError();
  document.getElementById('result').style.display = 'none';
  setStatus('Leyendo documento Word...', 15);

  try {
    const arrayBuffer = await file.arrayBuffer();
    setStatus('Extrayendo texto...', 35);

    const result = await mammoth.extractRawText({ arrayBuffer });
    const texto = result.value;

    setStatus('Analizando preguntas y respuestas...', 60);

    const preguntas = parsearPreguntas(texto);

    if (preguntas.length === 0) {
      showError('No se detectaron preguntas. Asegúrate de que el documento tenga el formato PREGUNTA / Respuesta.');
      return;
    }

    setStatus('Generando archivo preguntas.js...', 85);
    await delay(300);
    setStatus('¡Listo!', 100);
    await delay(400);

    document.getElementById('status').style.display = 'none';
    mostrarResultado(preguntas);

  } catch (err) {
    showError('Error procesando el archivo: ' + err.message);
  }
}

const delay = ms => new Promise(r => setTimeout(r, ms));

// ───────── Parser inteligente ─────────
function parsearPreguntas(texto) {
  const lineas = texto.split('\n').map(l => l.trim()).filter(Boolean);
  const preguntas = [];

  let modoPregunta = false;
  let modoRespuesta = false;
  let preguntaActual = [];
  let respuestaActual = [];

  const esMarcadorPregunta = l => /^PREGUNTA\s*$/i.test(l);
  const esMarcadorRespuesta = l => /^RESPUESTA[S]?\s*:?\s*$/i.test(l) || /^Respuesta\s*:?\s*$/i.test(l);

  for (let i = 0; i < lineas.length; i++) {
    const l = lineas[i];

    if (esMarcadorPregunta(l)) {
      // Guardar la anterior si la hay
      if (preguntaActual.length > 0 && respuestaActual.length > 0) {
        preguntas.push(crearEntrada(preguntaActual.join(' '), respuestaActual.join(' ')));
      }
      preguntaActual = [];
      respuestaActual = [];
      modoPregunta = true;
      modoRespuesta = false;
      continue;
    }

    if (esMarcadorRespuesta(l)) {
      modoPregunta = false;
      modoRespuesta = true;
      continue;
    }

    if (modoPregunta) {
      preguntaActual.push(l);
    } else if (modoRespuesta) {
      respuestaActual.push(l);
    }
  }

  // Última entrada
  if (preguntaActual.length > 0 && respuestaActual.length > 0) {
    preguntas.push(crearEntrada(preguntaActual.join(' '), respuestaActual.join(' ')));
  }

  // Eliminar duplicados exactos de pregunta
  const vistos = new Set();
  return preguntas.filter(p => {
    const key = p.pregunta.toLowerCase().slice(0, 80);
    if (vistos.has(key)) return false;
    vistos.add(key);
    return true;
  });
}

function crearEntrada(pregunta, respuesta) {
  const palabrasclave = extraerPalabrasClave(pregunta + ' ' + respuesta);
  return { pregunta: pregunta.trim(), respuesta: respuesta.trim(), palabrasclave };
}

function extraerPalabrasClave(texto) {
  const stopWords = new Set(['que','de','la','el','los','las','un','una','en','es','se','del','al','por','con','para','una','sus','son','como','pero','más','este','esta','esto','han','hay','muy','fue','ser','si','no','yo','tu','le','su','ya','nos','sin','sobre','entre','cuando','donde','porque','aunque','también','lo','me','te','mi','ni','hasta','bajo','ante','tras','hacia','mediante','según','durante','mediante','dentro','fuera','parte','bien','así','cada','luego','otro','aquí','ahí','eso','esa','ese','esos','esas']);

  const palabras = texto.toLowerCase()
    .replace(/[¿?¡!,.:;()\[\]""«»—–\-]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 4 && !stopWords.has(w) && /^[a-záéíóúüñ]+$/i.test(w));

  const freq = {};
  for (const w of palabras) freq[w] = (freq[w] || 0) + 1;

  return Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([w]) => w)
    .join(',');
}

// ───────── Mostrar resultado ─────────
function mostrarResultado(preguntas) {
  document.getElementById('result').style.display = 'block';
  document.getElementById('countLabel').textContent = preguntas.length + ' preguntas';

  const lista = document.getElementById('questionsList');
  lista.innerHTML = '';

  preguntas.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.animationDelay = Math.min(i * 30, 400) + 'ms';

    const keywords = p.palabrasclave.split(',').filter(Boolean)
      .map(k => `<span>${k}</span>`).join('');

    card.innerHTML = `
      <div class="q-num">PREGUNTA ${String(i + 1).padStart(2, '0')}</div>
      <div class="q-text">${escHtml(p.pregunta.slice(0, 120))}${p.pregunta.length > 120 ? '…' : ''}</div>
      <div class="q-keywords">${keywords}</div>
    `;
    lista.appendChild(card);
  });

  // Botón descarga
  document.getElementById('downloadBtn').onclick = () => descargar(preguntas);
  document.getElementById('resetBtn').onclick = resetear;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ───────── Generar y descargar preguntas.js ─────────
function descargar(preguntas) {
  const titulo = 'CIENCIAS NATURALES';

  const entries = preguntas.map(p =>
    `  {\n    pregunta: ${JSON.stringify(p.pregunta)},\n    respuesta: ${JSON.stringify(p.respuesta)},\n    palabrasclave: ${JSON.stringify(p.palabrasclave)}\n  }`
  ).join(',\n');

  const contenido =
`const titulo_del_juego = ${JSON.stringify(titulo)};

const preguntas = [
${entries}
];
`;

  const blob = new Blob([contenido], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'preguntas.js';
  a.click();
  URL.revokeObjectURL(url);
}

// ───────── Reset ─────────
function resetear() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('status').style.display = 'none';
  hideError();
  fileInput.value = '';
}
</script>
</body>
</html>
