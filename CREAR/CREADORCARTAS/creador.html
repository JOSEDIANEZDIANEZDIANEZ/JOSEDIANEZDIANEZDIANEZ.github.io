<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertidor DOCX → Juego completo</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- JSZIP PARA CREAR EL ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8ff00;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #666;
      --card: #1a1a1a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .badge {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.7em;
      letter-spacing: 3px;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(1.6em, 5vw, 2.6em);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95em;
      font-weight: 300;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }

    .drop-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(200,255,0,0.05) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: #1a1f0d;
    }

    .drop-zone.dragover::before {
      opacity: 1;
    }

    .drop-icon {
      font-size: 3.5em;
      margin-bottom: 16px;
      display: block;
      transition: transform 0.3s;
    }

    .drop-zone.dragover .drop-icon {
      transform: scale(1.15) translateY(-4px);
    }

    .drop-title {
      font-family: 'Space Mono', monospace;
      font-size: 1.1em;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .drop-subtitle {
      color: var(--muted);
      font-size: 0.9em;
    }

    .drop-subtitle strong {
      color: var(--accent);
      font-weight: 600;
    }

    #fileInput {
      display: none;
    }

    #status {
      margin-top: 24px;
      display: none;
    }

    .status-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.85em;
      color: var(--accent);
    }

    .progress-bar-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }

    #result {
      margin-top: 24px;
      display: none;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .result-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.9em;
      color: var(--muted);
    }

    .result-count {
      font-family: 'Space Mono', monospace;
      font-size: 1.1em;
      color: var(--accent);
      font-weight: 700;
    }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 20px;
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .q-num {
      font-family: 'Space Mono', monospace;
      font-size: 0.7em;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 0.9em;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .q-keywords {
      font-size: 0.78em;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .q-keywords span {
      display: inline-block;
      background: rgba(200,255,0,0.08);
      color: var(--accent);
      border-radius: 3px;
      padding: 1px 6px;
      margin: 2px 2px 0 0;
      font-size: 0.9em;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 1em;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .download-btn:hover {
      background: #d4ff1a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,255,0,0.2);
    }

    .reset-btn {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 24px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9em;
      cursor: pointer;
    }

    .error-box {
      background: #1a0d0d;
      border: 1px solid #4a1a1a;
      border-radius: 10px;
      padding: 16px 20px;
      color: #ff6b6b;
      font-size: 0.9em;
      margin-top: 16px;
      display: none;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8em;
      font-family: 'Space Mono', monospace;
    }

    footer span {
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <div class="badge">Herramienta de estudio</div>
    <h1>DOCX <span>→</span> Juego completo</h1>
    <p class="subtitle">Genera automáticamente la carpeta completa del juego</p>
  </header>

  <div class="drop-zone" id="dropZone">
    <span class="drop-icon">📄</span>
    <div class="drop-title">Arrastra tu archivo .docx aquí</div>
    <div class="drop-subtitle">
      Se generará un ZIP con:
      <strong>index.html + preguntas.js + sonidos + gif</strong>
    </div>

    <input type="file" id="fileInput" accept=".docx">
  </div>

  <div id="status">
    <div class="status-box">
      <div class="status-header">
        <div class="spinner"></div>
        <div class="status-label" id="statusLabel">Leyendo documento...</div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="result">
    <div class="result-header">
      <div class="result-title">Preguntas detectadas</div>
      <div class="result-count" id="countLabel">0 preguntas</div>
    </div>

    <div class="questions-list" id="questionsList"></div>

    <button class="download-btn" id="downloadBtn">
      ⬇ Descargar juego completo
    </button>

    <button class="reset-btn" id="resetBtn">
      Convertir otro archivo
    </button>
  </div>

</div>

<footer>
  Genera · Descarga · Juega con <span>index.html</span>
</footer>

<script>

// =========================================================
// ARCHIVOS QUE DEBEN ESTAR EN LA MISMA CARPETA QUE creador.html
// =========================================================

const ARCHIVOS_BASE = [
  'index.html',
  'flip.mp3',
  'ganador.MP3',
  'baile.gif'
];

// =========================================================
// DRAG & DROP
// =========================================================

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

let preguntasGeneradas = [];


dropZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) {
    processFile(e.target.files[0]);
  }
});


dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});


dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});


dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');

  const file = e.dataTransfer.files[0];

  if (file && file.name.endsWith('.docx')) {
    processFile(file);
  } else {
    showError('Por favor arrastra un archivo .docx válido.');
  }
});

// =========================================================
// UI
// =========================================================

function setStatus(label, progress) {
  document.getElementById('status').style.display = 'block';
  document.getElementById('statusLabel').textContent = label;
  document.getElementById('progressBar').style.width = progress + '%';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
}

function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

const delay = ms => new Promise(r => setTimeout(r, ms));

// =========================================================
// PROCESAR DOCX
// =========================================================

async function processFile(file) {

  hideError();

  document.getElementById('result').style.display = 'none';

  setStatus('Leyendo documento Word...', 15);

  try {

    const arrayBuffer = await file.arrayBuffer();

    setStatus('Extrayendo texto...', 35);

    const result = await mammoth.extractRawText({ arrayBuffer });

    const texto = result.value;

    setStatus('Analizando preguntas...', 60);

    const preguntas = parsearPreguntas(texto);

    if (preguntas.length === 0) {
      showError('No se detectaron preguntas válidas.');
      return;
    }

    preguntasGeneradas = preguntas;

    setStatus('Preparando juego completo...', 90);

    await delay(400);

    setStatus('¡Juego listo!', 100);

    await delay(300);

    document.getElementById('status').style.display = 'none';

    mostrarResultado(preguntas);

  } catch (err) {

    showError('Error procesando archivo: ' + err.message);
  }
}

// =========================================================
// PARSER
// =========================================================

function parsearPreguntas(texto) {

  const lineas = texto
    .split('\n')
    .map(l => l.trim())
    .filter(Boolean);

  const preguntas = [];

  let modoPregunta = false;
  let modoRespuesta = false;

  let preguntaActual = [];
  let respuestaActual = [];

  const esPregunta = l => /^PREGUNTA\s*$/i.test(l);

  const esRespuesta = l =>
    /^RESPUESTA[S]?\s*:?\s*$/i.test(l) ||
    /^Respuesta\s*:?\s*$/i.test(l);

  for (let i = 0; i < lineas.length; i++) {

    const l = lineas[i];

    if (esPregunta(l)) {

      if (preguntaActual.length > 0 && respuestaActual.length > 0) {

        preguntas.push(
          crearEntrada(
            preguntaActual.join(' '),
            respuestaActual.join(' ')
          )
        );
      }

      preguntaActual = [];
      respuestaActual = [];

      modoPregunta = true;
      modoRespuesta = false;

      continue;
    }

    if (esRespuesta(l)) {
      modoPregunta = false;
      modoRespuesta = true;
      continue;
    }

    if (modoPregunta) {
      preguntaActual.push(l);
    }

    else if (modoRespuesta) {
      respuestaActual.push(l);
    }
  }

  if (preguntaActual.length > 0 && respuestaActual.length > 0) {

    preguntas.push(
      crearEntrada(
        preguntaActual.join(' '),
        respuestaActual.join(' ')
      )
    );
  }

  return preguntas;
}

function crearEntrada(pregunta, respuesta) {

  const palabrasclave = extraerPalabrasClave(
    pregunta + ' ' + respuesta
  );

  return {
    pregunta: pregunta.trim(),
    respuesta: respuesta.trim(),
    palabrasclave
  };
}

function extraerPalabrasClave(texto) {

  const stopWords = new Set([
    'que','de','la','el','los','las','un','una','en','es','se','del','al',
    'por','con','para','sus','son','como','pero','más','este','esta',
    'esto','han','hay','muy','fue','ser','si','no'
  ]);

  const palabras = texto.toLowerCase()
    .replace(/[¿?¡!,.:;()\[\]""«»—–\-]/g, ' ')
    .split(/\s+/)
    .filter(w =>
      w.length > 4 &&
      !stopWords.has(w) &&
      /^[a-záéíóúüñ]+$/i.test(w)
    );

  const freq = {};

  for (const w of palabras) {
    freq[w] = (freq[w] || 0) + 1;
  }

  return Object.entries(freq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([w]) => w)
    .join(',');
}

// =========================================================
// RESULTADO
// =========================================================

function mostrarResultado(preguntas) {

  document.getElementById('result').style.display = 'block';

  document.getElementById('countLabel').textContent =
    preguntas.length + ' preguntas';

  const lista = document.getElementById('questionsList');

  lista.innerHTML = '';

  preguntas.forEach((p, i) => {

    const card = document.createElement('div');

    card.className = 'q-card';

    const keywords = p.palabrasclave
      .split(',')
      .filter(Boolean)
      .map(k => `<span>${k}</span>`)
      .join('');

    card.innerHTML = `
      <div class="q-num">PREGUNTA ${String(i + 1).padStart(2, '0')}</div>
      <div class="q-text">${escHtml(p.pregunta)}</div>
      <div class="q-keywords">${keywords}</div>
    `;

    lista.appendChild(card);
  });

  document.getElementById('downloadBtn').onclick = descargarJuegoCompleto;

  document.getElementById('resetBtn').onclick = resetear;
}

function escHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// =========================================================
// CREAR preguntas.js
// =========================================================

function generarPreguntasJS(preguntas, tituloJuego) {

  const entries = preguntas.map(p =>
`
  {
    pregunta: ${JSON.stringify(p.pregunta)},
    respuesta: ${JSON.stringify(p.respuesta)},
    palabrasclave: ${JSON.stringify(p.palabrasclave)}
  }
`
  ).join(',');

  return `const titulo_del_juego = ${JSON.stringify(tituloJuego)};

const preguntas = [
${entries}
];`;
}

// =========================================================
// DESCARGAR JUEGO COMPLETO
// =========================================================

async function descargarJuegoCompleto() {

  try {

    const nombreJuego = prompt(
      'Nombre de la carpeta del juego:',
      'Mi Juego'
    );

    if (!nombreJuego) return;

    setStatus('Creando carpeta del juego...', 20);

    document.getElementById('status').style.display = 'block';

    const zip = new JSZip();

    const carpeta = zip.folder(nombreJuego);

    // =====================================================
    // CREAR preguntas.js
    // =====================================================

    const preguntasJS = generarPreguntasJS(
      preguntasGeneradas,
      nombreJuego
    );

    carpeta.file('preguntas.js', preguntasJS);

    // =====================================================
    // COPIAR ARCHIVOS BASE
    // =====================================================

    for (let i = 0; i < ARCHIVOS_BASE.length; i++) {

      const archivo = ARCHIVOS_BASE[i];

      setStatus('Añadiendo ' + archivo + '...', 35 + (i * 10));

      const response = await fetch(archivo);

      if (!response.ok) {
        throw new Error(
          'No se encontró el archivo: ' + archivo
        );
      }

      const blob = await response.blob();

      carpeta.file(archivo, blob);
    }

    // =====================================================
    // GENERAR ZIP
    // =====================================================

    setStatus('Comprimiendo juego...', 85);

    const contenidoZip = await zip.generateAsync({
      type: 'blob'
    });

    setStatus('Descargando...', 100);

    const url = URL.createObjectURL(contenidoZip);

    const a = document.createElement('a');

    a.href = url;

    a.download = nombreJuego + '.zip';

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    await delay(600);

    document.getElementById('status').style.display = 'none';

  } catch (err) {

    showError(err.message);
  }
}

// =========================================================
// RESET
// =========================================================

function resetear() {

  document.getElementById('result').style.display = 'none';

  document.getElementById('status').style.display = 'none';

  hideError();

  fileInput.value = '';

  preguntasGeneradas = [];
}

</script>
</body>
</html>
