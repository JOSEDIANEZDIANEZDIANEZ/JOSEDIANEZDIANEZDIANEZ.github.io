<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cohetes: Construye y Reza</title>
<style>
  :root {
    --bg: #0e111a;
    --panel: #181d2a;
    --fg: #e1e6f0;
    --dim: #828ca0;
    --accent: #50a0ff;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: "DejaVu Sans", Verdana, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#c { display: block; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  #fs { position: fixed; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); right: calc(4px + env(safe-area-inset-right, 0px)); z-index: 5;
        width: 34px; height: 34px; border-radius: 6px; border: 1px solid #2a3350; background: rgba(24,29,42,.8); color: var(--dim);
        font-size: 18px; line-height: 1; cursor: pointer; opacity: .55; }
  #fs:hover, #fs:focus-visible { opacity: 1; color: var(--fg); border-color: var(--accent); }
  #nm { position: fixed; left: -300px; top: 0; width: 120px; font-size: 16px; opacity: 0; }
  #rot { display: none; position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--dim); font-size: 13px; padding: 0 16px; }
  @media (max-aspect-ratio: 1/1) { #rot { display: block; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720" tabindex="0" aria-label="Juego Cohetes: construye, prueba y reza"></canvas></div>
<button id="fs" type="button" title="Pantalla completa (Alt+Enter)" aria-label="Pantalla completa">⛶</button>
<input id="nm" maxlength="14" autocomplete="off" autocapitalize="characters" aria-label="Nombre del cohete">
<div id="rot">Gira el dispositivo en horizontal para jugar mejor.</div>
<script>
'use strict';
/* ============================================================ utilidades / UI */
const W = 1280, H = 720;
const BG = [14, 17, 26], PANEL = [24, 29, 42], PANEL2 = [34, 41, 58], TEXT = [225, 230, 240], DIM = [130, 140, 160];
const GOOD = [80, 210, 120], WARN = [240, 190, 60], BAD = [240, 70, 60], ACCENT = [80, 160, 255];
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const nameInput = document.getElementById('nm');
const FONT = '"DejaVu Sans", Verdana, "Segoe UI", Helvetica, Arial, sans-serif';

const cs = c => typeof c === 'string' ? c : (c.length === 4 ? `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3] / 255})` : `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pymod = (a, b) => ((a % b) + b) % b;
const now = () => performance.now();
const sgn = v => v > 0 ? 1 : (v < 0 ? -1 : 0);
const rad = d => d * Math.PI / 180;

class RNG {
  constructor(seed) { this.s = (seed == null ? (Math.random() * 4294967296) : seed) >>> 0; this.spare = null; }
  random() { let t = this.s += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  uniform(a, b) { return a + (b - a) * this.random(); }
  randint(a, b) { return a + Math.floor(this.random() * (b - a + 1)); }
  randrange(n) { return Math.floor(this.random() * n); }
  choice(arr) { return arr[Math.floor(this.random() * arr.length)]; }
  choices(arr, w) { const tot = w.reduce((a, b) => a + b, 0); let r = this.random() * tot; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r < 0) return arr[i]; } return arr[arr.length - 1]; }
  gauss(mu, sigma) { const u = 1 - this.random(), v = this.random(); return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
}

/* ---- primitivas de dibujo (equivalentes a pygame.draw) */
function rrPath(x, y, w, h, r) { g.beginPath(); if (r > 0 && g.roundRect) g.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else g.rect(x, y, w, h); }
function fillRect(c, x, y, w, h, r = 0) { g.fillStyle = cs(c); if (r > 0) { rrPath(x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function strokeRect(c, x, y, w, h, lw = 1, r = 0) { g.strokeStyle = cs(c); g.lineWidth = lw; rrPath(x + lw / 2, y + lw / 2, w - lw, h - lw, Math.max(0, r - lw / 2)); g.stroke(); }
function poly(c, pts) { g.fillStyle = cs(c); g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); }
function circle(c, x, y, r) { if (r <= 0) return; g.fillStyle = cs(c); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ellipse(c, x, y, w, h) { if (w <= 0 || h <= 0) return; g.fillStyle = cs(c); g.beginPath(); g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); g.fill(); }
function line(c, x1, y1, x2, y2, w = 1) { g.strokeStyle = cs(c); g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function polyline(c, pts, w = 1) { g.strokeStyle = cs(c); g.lineWidth = w; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); }
const inRect = (p, r) => p[0] >= r[0] && p[0] < r[0] + r[2] && p[1] >= r[1] && p[1] < r[1] + r[3];

const ANCH = { topleft: ['left', 'top'], midtop: ['center', 'top'], topright: ['right', 'top'], center: ['center', 'middle'], midbottom: ['center', 'bottom'] };
const fontStr = (size, bold) => `${bold ? "bold " : ""}${(size * 0.93).toFixed(1)}px ${FONT}`;
function txt(s, x, y, size = 16, color = TEXT, bold = false, anchor = 'topleft') {
  const a = ANCH[anchor];
  g.font = fontStr(size, bold); g.fillStyle = cs(color); g.textAlign = a[0]; g.textBaseline = a[1];
  g.fillText(String(s), x, y + (a[1] === 'top' ? size * 0.08 : 0));
}
function textW(s, size, bold = false) { g.font = fontStr(size, bold); return g.measureText(s).width; }

function panelR(r, color = PANEL, border = null, radius = 8) {
  fillRect(color, r[0], r[1], r[2], r[3], radius);
  if (border) strokeRect(border, r[0], r[1], r[2], r[3], 2, radius);
}
function bar(r, frac, color, back = [45, 50, 66]) {
  frac = clamp(frac, 0, 1);
  fillRect(back, r[0], r[1], r[2], r[3], 3);
  if (frac > 0) fillRect(color, r[0], r[1], r[2] * frac, r[3], 3);
}
function overlayPanel(x, y, w, h) {
  fillRect([10, 13, 20, 215], x, y, w, h, 10);
  strokeRect(ACCENT, x, y, w, h, 2, 10);
}

/* ---- ratón / teclado */
const mouse = { x: -1, y: -1, down: false };
const held = new Set();
const mpos = () => [mouse.x, mouse.y];

class Button {
  constructor(rect, label, color = PANEL2, hot = ACCENT, size = 16) { this.r = rect; this.label = label; this.color = color; this.hot = hot; this.size = size; this.enabled = true; }
  draw() {
    const over = this.enabled && inRect(mpos(), this.r);
    let col = over ? this.hot : this.color;
    if (!this.enabled) col = [45, 48, 58];
    panelR(this.r, col, null, 6);
    txt(this.label, this.r[0] + this.r[2] / 2, this.r[1] + this.r[3] / 2, this.size, this.enabled ? TEXT : DIM, true, 'center');
  }
  clicked(ev) { return this.enabled && ev.type === 'down' && inRect(ev.pos, this.r); }
}

/* ============================================================ datos */
const ENGINES = [
  { name: 'Colibrí S1', thrust: 600e3, mass: 700, isp_sl: 280, isp_vac: 305, risk: 0.00004, heat: 0.7, cost: 4 },
  { name: 'Halcón M7', thrust: 1200e3, mass: 1500, isp_sl: 290, isp_vac: 325, risk: 0.00007, heat: 1.0, cost: 9 },
  { name: 'Titán H9', thrust: 2600e3, mass: 3300, isp_sl: 300, isp_vac: 340, risk: 0.00012, heat: 1.4, cost: 22 },
  { name: 'Vacío V-Ion', thrust: 250e3, mass: 350, isp_sl: 190, isp_vac: 385, risk: 0.00005, heat: 0.5, cost: 7 },
  { name: 'Experimental X', thrust: 4200e3, mass: 4600, isp_sl: 320, isp_vac: 365, risk: 0.00030, heat: 2.0, cost: 40 },
];
const FUELS = [
  { name: 'Queroseno/LOX', dens: 1030, isp: 1.00, risk: 1.0, press: 1.0, cost: 1.0 },
  { name: 'Metano/LOX', dens: 830, isp: 1.08, risk: 1.1, press: 1.2, cost: 1.3 },
  { name: 'Hidrógeno/LOX', dens: 290, isp: 1.28, risk: 1.4, press: 1.6, cost: 2.0 },
  { name: 'Hipergólico', dens: 1200, isp: 0.93, risk: 0.7, press: 0.8, cost: 1.6 },
];
const SIZES = [
  { name: 'Pequeño', vol: 20, width: 34, strength: 1.0 },
  { name: 'Mediano', vol: 60, width: 50, strength: 1.5 },
  { name: 'Grande', vol: 150, width: 70, strength: 2.2 },
];
const NOSES = ['Cónica', 'Ojival', 'Redondeada', 'Plana'];
const PALETTE = [['Blanco', [240, 240, 245]], ['Rojo', [205, 50, 50]], ['Azul', [50, 100, 205]], ['Naranja', [240, 140, 40]], ['Verde', [60, 170, 90]],
  ['Negro', [40, 40, 48]], ['Plata', [170, 175, 185]], ['Amarillo', [235, 210, 60]], ['Morado', [130, 70, 180]]];
const TANK_DRY_PER_M3 = 58, PAYLOAD_SAT = 1800, PAYLOAD_CREW = 5200, ESCAPE_TOWER_MASS = 900, FINS_MASS = 400, SHIELD_MASS = 150;
const MAX_STAGES = 3, MAX_TANKS = 8, MAX_ENGINES = 6;
const EARTH_R = 6371e3, EARTH_MU = 3.986e14, FUEL_ECON = 1.25;
const TARGET_ORBIT_ALT = 120e3, TARGET_APO = 500e3, LOW_ORBIT_PER = 100e3;
const G0 = 9.80665;
const CITIES = [
  [-9000, 'Puerto Alba', 7], [3000, 'Villa Roca', 5], [14000, 'Monte Claro', 6], [30000, 'San Cohete', 8],
  [52000, 'Bahía Sol', 7], [80000, 'Nueva Esperanza', 9], [120000, 'Ciudad Hierro', 10],
];
function hitCities(downrange, alt) {
  if (alt > 120e3) return [];
  const radius = 6000 + alt * 0.5;
  const out = [];
  CITIES.forEach((c, i) => { if (Math.abs(c[0] - downrange) <= radius) out.push(i); });
  return out;
}
function defaultConfig() {
  return {
    name: 'ALBA-1', size: 1, nose: 1, color_body: 0, color_accent: 1, crewed: false, tower: false, fins: true, shield: true,
    stages: [{ engine: 1, n_eng: 5, fuel: 0, tanks: 5 }, { engine: 1, n_eng: 2, fuel: 0, tanks: 2 }],
  };
}
/* ============================================================ modelo del cohete + dibujo */
function payloadMass(cfg) {
  let m = cfg.crewed ? PAYLOAD_CREW : PAYLOAD_SAT;
  if (cfg.crewed && cfg.tower) m += ESCAPE_TOWER_MASS;
  return m;
}
function stageStats(cfg, i) {
  const st = cfg.stages[i], eng = ENGINES[st.engine], fuel = FUELS[st.fuel], vol = SIZES[cfg.size].vol;
  const prop = st.tanks * vol * fuel.dens;
  let dry = st.tanks * vol * TANK_DRY_PER_M3 + st.n_eng * eng.mass;
  if (i === 0) { if (cfg.fins) dry += FINS_MASS; if (cfg.shield) dry += SHIELD_MASS; }
  const thrust = st.n_eng * eng.thrust;
  const isp_vac = eng.isp_vac * fuel.isp, isp_sl = eng.isp_sl * fuel.isp;
  return { prop, dry, thrust, isp_vac, isp_sl, mdot: thrust / (isp_vac * G0) };
}
function rocketSummary(cfg) {
  const n = cfg.stages.length;
  const stats = []; for (let i = 0; i < n; i++) stats.push(stageStats(cfg, i));
  let above = payloadMass(cfg);
  const dvs = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    const s = stats[i], m0 = above + s.dry + s.prop, m1 = above + s.dry;
    dvs[i] = m1 > 0 ? s.isp_vac * G0 * Math.log(m0 / m1) : 0;
    above = m0;
  }
  const total = above, twr = stats[0].thrust / (total * G0);
  let cost = 0;
  cfg.stages.forEach(st => { cost += ENGINES[st.engine].cost * st.n_eng; cost += st.tanks * SIZES[cfg.size].vol * 0.05 * FUELS[st.fuel].cost; });
  cost += cfg.crewed ? 30 : 10;
  cost += (cfg.tower && cfg.crewed) ? 5 : 0;
  return { mass: total, dv: dvs, dv_total: dvs.reduce((a, b) => a + b, 0), twr, cost, stats };
}
const shade = (c, f) => c.map(v => Math.max(0, Math.min(255, Math.floor(v * f))));

function rocketHeight(cfg, nStages, scale) {
  let h = 0;
  const th = 16 * scale * (1 + cfg.size * 0.25);
  for (let i = 0; i < nStages; i++) h += cfg.stages[i].tanks * th + 12 * scale;
  h += 30 * scale + (cfg.crewed ? 18 * scale : 0);
  if (cfg.crewed && cfg.tower) h += 26 * scale;
  return h;
}

/* Dibuja el cohete con la base en baseY (crece hacia arriba). fontSize: tamaño del nombre (negrita) o null. */
function drawRocket(cfg, cx, baseY, scale = 1.0, nStages = null, flame = 0.0, fontSize = null, frame = 0) {
  if (nStages == null) nStages = cfg.stages.length;
  const body = PALETTE[cfg.color_body][1], acc = PALETTE[cfg.color_accent][1];
  const w = SIZES[cfg.size].width * scale;
  const th = 16 * scale * (1 + cfg.size * 0.25);
  let y = baseY, first = null;
  for (let i = 0; i < nStages; i++) {
    const st = cfg.stages[i], n = st.n_eng;
    const bw = Math.min(w / Math.max(n, 1) * 0.9, 16 * scale);
    for (let k = 0; k < n; k++) {
      const ex = cx - w / 2 + w * (k + 0.5) / n;
      poly([90, 90, 98], [[ex - bw * 0.3, y], [ex + bw * 0.3, y], [ex + bw * 0.5, y + 12 * scale], [ex - bw * 0.5, y + 12 * scale]]);
      if (i === 0 && flame > 0) {
        const fl = flame * (30 + 14 * Math.sin(frame * 0.7 + k)) * scale;
        poly([255, 190, 70], [[ex - bw * 0.5, y + 12 * scale], [ex + bw * 0.5, y + 12 * scale], [ex, y + 12 * scale + fl]]);
        poly([255, 250, 200], [[ex - bw * 0.25, y + 12 * scale], [ex + bw * 0.25, y + 12 * scale], [ex, y + 12 * scale + fl * 0.55]]);
      }
    }
    if (i === 0 && cfg.fins) {
      poly(acc, [[cx - w / 2, y - 4 * scale], [cx - w / 2 - 14 * scale, y + 10 * scale], [cx - w / 2, y - 30 * scale]]);
      poly(acc, [[cx + w / 2, y - 4 * scale], [cx + w / 2 + 14 * scale, y + 10 * scale], [cx + w / 2, y - 30 * scale]]);
    }
    const sh = st.tanks * th;
    const rect = { x: cx - w / 2, y: y - sh, w: w, h: sh };
    fillRect(body, rect.x, rect.y, w, sh);
    fillRect(shade(body, 0.75), rect.x + w * 0.72, rect.y, w * 0.28, sh);
    for (let t = 1; t < st.tanks; t++) line(shade(body, 0.6), rect.x, rect.y + rect.h - t * th, rect.x + w, rect.y + rect.h - t * th, 1);
    fillRect(acc, rect.x, rect.y, w, Math.max(3, 4 * scale));
    fillRect(acc, rect.x, rect.y + rect.h - Math.max(3, 4 * scale), w, Math.max(3, 4 * scale));
    if (i === 0) first = rect;
    y -= sh + 12 * scale;
    fillRect([60, 60, 66], cx - w * 0.4, y + 12 * scale - 3 * scale, w * 0.8, 6 * scale);
  }
  y += 12 * scale - 4 * scale;
  let top = y;
  if (cfg.crewed) {
    const ch = 18 * scale;
    fillRect(shade(body, 0.9), cx - w * 0.4, top - ch, w * 0.8, ch);
    circle([120, 190, 235], Math.floor(cx), Math.floor(top - ch * 0.5), Math.max(2, Math.floor(4 * scale)));
    top -= ch;
  }
  const nh = 30 * scale, ws = w * (cfg.crewed ? 0.4 : 0.5), nose = cfg.nose;
  let pts;
  if (nose === 0) pts = [[cx - ws, top], [cx + ws, top], [cx, top - nh]];
  else if (nose === 1) pts = [[cx - ws, top], [cx - ws * 0.7, top - nh * 0.5], [cx - ws * 0.25, top - nh * 0.85], [cx, top - nh], [cx + ws * 0.25, top - nh * 0.85], [cx + ws * 0.7, top - nh * 0.5], [cx + ws, top]];
  else if (nose === 2) pts = [[cx - ws, top], [cx - ws * 0.9, top - nh * 0.5], [cx - ws * 0.5, top - nh * 0.9], [cx, top - nh], [cx + ws * 0.5, top - nh * 0.9], [cx + ws * 0.9, top - nh * 0.5], [cx + ws, top]];
  else pts = [[cx - ws, top], [cx - ws * 0.8, top - nh * 0.5], [cx + ws * 0.8, top - nh * 0.5], [cx + ws, top]];
  poly(acc, pts);
  top -= nh * (nose === 3 ? 0.5 : 1);
  if (cfg.crewed && cfg.tower) {
    line([200, 200, 205], cx, top, cx, top - 22 * scale, Math.max(1, Math.floor(2 * scale)));
    poly([230, 90, 40], [[cx - 3 * scale, top - 22 * scale], [cx + 3 * scale, top - 22 * scale], [cx, top - 30 * scale]]);
    top -= 26 * scale;
  }
  if (cfg.shield) line([230, 230, 120], cx, top, cx, top - 8 * scale, 1);
  if (fontSize && first && cfg.name) {
    const col = body[0] + body[1] + body[2] > 380 ? shade(body, 0.35) : [245, 245, 245];
    const tw = textW(cfg.name, fontSize, true);
    let f = 1; if (tw > first.h - 6) f = (first.h - 6) / tw;
    g.save(); g.translate(cx - w * 0.15, first.y + first.h / 2); g.rotate(-Math.PI / 2); g.scale(f, f);
    txt(cfg.name, 0, 0, fontSize, col, true, 'center'); g.restore();
  }
  return baseY - top;
}
/* ============================================================ clima */
const CONDITIONS = ['Despejado', 'Nublado', 'Lluvia', 'Tormenta eléctrica'];
class Weather {
  constructor(rng) {
    this.rng = rng || new RNG();
    this.hour = this.rng.uniform(0, 24);
    this.cond = this.rng.choices([0, 1, 2, 3], [35, 25, 22, 18]);
    this.wind = this.rng.uniform(0, 12) + this.cond * 3;
    this.wind_dir = this.rng.choice([-1, 1]);
    this.temp = 8 + 14 * Math.sin((this.hour - 9) / 24 * 2 * Math.PI) + this.rng.uniform(-3, 3);
    this.flash = 0; this.bolt_x = 0.5; this.clock = 0;
  }
  get name() { return CONDITIONS[this.cond]; }
  get rain() { return this.cond >= 2; }
  get is_night() { return this.hour < 6 || this.hour > 20; }
  daylight() {
    const h = this.hour;
    return (h > 5 && h < 21) ? clamp((Math.sin((h - 6) / 12 * Math.PI) + 0.25) / 1.0, 0, 1) : 0;
  }
  update(dt) {
    this.clock += dt;
    this.hour = pymod(this.hour + dt / 120, 24);
    this.flash = Math.max(0, this.flash - dt * 2.5);
    this.wind = Math.max(0, this.wind + this.rng.uniform(-0.6, 0.6) * dt);
    if (this.rng.random() < dt / 60) this.cond = clamp(this.cond + this.rng.choice([-1, 0, 1]), 0, 3);
    let bolt = false;
    if (this.cond === 3 && this.rng.random() < dt / 3.5) { this.flash = 1; this.bolt_x = this.rng.random(); bolt = true; }
    return bolt;
  }
  gust(alt) {
    if (alt > 25000) return 0;
    const k = 1 + 1.2 * Math.sin(alt / 4000);
    return this.wind_dir * this.wind * k * (alt < 14000 ? 1 : (25000 - alt) / 11000);
  }
  sky_color(alt) {
    const d = this.daylight();
    const dawn = Math.max(0, 1 - Math.abs(this.hour - 6.5) / 1.3, 1 - Math.abs(this.hour - 19.5) / 1.3);
    const day = [90, 150, 235], night = [6, 8, 22];
    let col = [0, 1, 2].map(i => night[i] + (day[i] - night[i]) * d);
    col[0] += 140 * dawn; col[1] += 60 * dawn;
    const grey = this.cond === 0 ? 0 : (this.cond === 1 ? 0.35 : 0.6);
    const base = (col[0] + col[1] + col[2]) / 3 * 0.8;
    col = col.map(c => c * (1 - grey) + base * grey);
    const space = clamp((alt - 15000) / 90000, 0, 1);
    col = col.map(c => c * (1 - space) + 2 * space);
    return col.map(c => Math.floor(clamp(c, 0, 255)));
  }
  star_alpha(alt) {
    const space = clamp((alt - 15000) / 90000, 0, 1);
    const night = 1 - this.daylight();
    const cloud = this.cond < 2 ? 0 : 0.5;
    return Math.max(space, night * (1 - cloud));
  }
}

/* ============================================================ fallos */
const FAULT_INFO = {
  pressure: ['Pico de presión en tanques', 'Pulsa V (ventear)'],
  vibration: ['Vibración / sobrecalentamiento del motor', 'Pulsa C (refrigerar) o baja el acelerador <50%'],
  avionics: ['Fallo de aviónica / guiado', 'Pulsa R (reiniciar sistemas)'],
  pogo: ['Oscilación POGO en el motor', 'Mantén el acelerador entre 35% y 65%'],
};
class Faults {
  constructor(sim) { this.sim = sim; this.active = {}; this.reset_timer = 0; this.reset_cool = 0; this.leak = 0; this.warned = new Set(); }
  nActive() { return Object.keys(this.active).length; }
  thrust_factor() { let f = this.reset_timer > 0 ? 0 : 1; if (this.sim.integrity < 40) f *= 0.9; return f; }

      for (let k = 0; k < 14; k++) this.particles.push([W / 2, 250, (tx - W / 2) + this.rng.uniform(-30, 30), this.rng.uniform(120, 260), 1.4, [255, 150, 40], 5]);
    }

    for (let k = 0; k < 180; k++) {
      const a = this.rng.uniform(0, Math.PI * 2), v = this.rng.uniform(40, 420);
      this.particles.push([W / 2, 250, Math.cos(a) * v, Math.sin(a) * v, this.rng.uniform(0.8, 2.6), this.rng.choice(palette), this.rng.uniform(2, 7)]);

    const h = rocketHeight(sub, 1, this.scale) + 40;

    for (let k = 0; k < 25; k++) this.particles.push([W / 2, 300, this.rng.uniform(-60, 60), this.rng.uniform(0, 100), 0.6, [255, 230, 150], 3]);

      txt(s.crew_saved ? 'Tripulación a salvo gracias a la torre de escape.' : 'La tripulación ha perdido la vida.', W / 2, y, 16, s.crew_saved ? GOOD : BAD, true, 'midtop'); y += 30;
    }
    [['Altitud máxima', `${fmtn(s.max_alt / 1000)} km`], ['Tiempo de vuelo', `${fmtn(s.t)} s`], ['Integridad final', `${s.integrity.toFixed(0)}%`], ['Puntuación', fmtn(s.score())]]
      .forEach(([a, b], k) => { txt(a, W / 2 - 200, 300 + k * 26, 16, DIM); txt(b, W / 2 + 200, 300 + k * 26, 16, TEXT, true, 'topright'); });
    this.btn_res_build.draw(); this.btn_res_retry.draw();
    txt('Esc: constructor · Enter: repetir', W / 2, 500, 13, DIM, false, 'midtop');
  }
  drawTelemetry() {
    const s = this.sim;
    fillRect([10, 13, 20], 0, TEL_Y, W, H - TEL_Y);
    line(ACCENT, 0, TEL_Y, W, TEL_Y, 2);

      ['Vel. horizontal', `${fmtn(s.vt)} m/s`, TEXT], ['Mach', s.mach.toFixed(1), TEXT], ['Fuerza G', `${s.gforce.toFixed(1)} g`, levelColor(s.gforce, 4, 7)],
      ['Presión dinámica (q)', `${(s.q / 1000).toFixed(1)} kPa`, levelColor(s.q, 25000, 40000)], ['Rozamiento (casco)', `${s.temp_skin.toFixed(0)} °C`, levelColor(s.temp_skin, 450, 700)]];

    const x1 = 350;

      ['Estrés estructural', s.stress, 1.5, `${(s.stress * 100).toFixed(0)}%`, 0.7, 1.0]].forEach(([a, v, mx, lab, w, b], k) => {

      .forEach(([a, v, lab, col], k) => {

    bar([x2, yy + 20, 270, 6], 0, ACCENT);

    txt(`Clima: ${w.name} · viento ${w.wind.toFixed(0)} m/s · ${String(Math.floor(w.hour)).padStart(2, '0')}:${String(Math.floor((w.hour % 1) * 60)).padStart(2, '0')}`, x3, y0, 13, w.cond >= 2 ? WARN : DIM);
    txt(`Tiempo ×${WARPS[this.warp_i]} (T) · T+${fmtn(s.t)}s`, x3, y0 + 18, 13, DIM);
    const lines = [];
    for (const [t, msg, lvl] of s.log.slice(-8)) {
      let cur = '';
      for (const wd of msg.split(' ')) { if (textW(cur + wd, 12) > 275) { lines.push([cur, lvl]); cur = '  '; } cur += wd + ' '; }

}
/* ============================================================ sonido (WebAudio, sintetizado) */
const RATE = 22050;
function noiseLP(n, k, rng) { const out = new Float32Array(n); let y = 0; for (let i = 0; i < n; i++) { y += (rng.uniform(-1, 1) - y) * k; out[i] = y; } return out; }
function toneArr(freq, dur, decay = 4, vol = 1, shape = 0) {
  const n = Math.floor(RATE * dur), out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const t = i / RATE; let s = Math.sin(2 * Math.PI * freq * t); if (shape) s = s > 0 ? 1 : -1; out[i] = s * Math.exp(-decay * t) * vol; }
  return out;
}
function cat(...arrs) { const n = arrs.reduce((a, b) => a + b.length, 0), out = new Float32Array(n); let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; } return out; }

class Sounds {
  constructor() {
    this.ok = false; this.muted = false; this.ctx = null; this.buf = {}; this.active = new Set();
    this.last_countdown = null; this.last_status = null; this.last_log = 0; this.last_flash = 0; this.alarm_t = 0; this.eng_ch = null; this.hiss_ch = null; this._seen = null;
  }
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.8; this.master.connect(this.ctx.destination);
      this.build(); this.ok = true;
    } catch (e) { this.ok = false; }
  }
  mk(samples, vol = 1) {
    let peak = 1e-9; for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
    const b = this.ctx.createBuffer(1, samples.length, RATE), d = b.getChannelData(0);
    for (let i = 0; i < samples.length; i++) d[i] = clamp(samples[i] / peak * vol, -1, 1) * 0.976;
    return b;
  }
  build() {
    const r = new RNG(7); let n = RATE * 2;
    const low = noiseLP(n, 0.06, r), mid = noiseLP(n, 0.25, r), eng = new Float32Array(n);
    for (let i = 0; i < n; i++) { const t = i / RATE; const tone = Math.sin(2 * Math.PI * 44 * t) + 0.6 * Math.sin(2 * Math.PI * 88 * t) + 0.3 * Math.sin(2 * Math.PI * 132 * t); eng[i] = low[i] * 2.2 + mid[i] * 0.9 + tone * 0.25; }
    this.buf.engine = this.mk(eng, 0.9);
    n = Math.floor(RATE * 2.8);
    let a = noiseLP(n, 0.5, r), b = noiseLP(n, 0.04, r); const ex = new Float32Array(n);
    for (let i = 0; i < n; i++) ex[i] = (a[i] * 0.6 + b[i] * 2.5) * Math.exp(-i / RATE * 1.6) * (i > 40 ? 1 : i / 40);
    this.buf.boom = this.mk(ex, 1.0);
    n = Math.floor(RATE * 3.0); b = noiseLP(n, 0.03, r); const th = new Float32Array(n);
    for (let i = 0; i < n; i++) th[i] = b[i] * (Math.exp(-i / RATE * 0.9) * (0.6 + 0.4 * Math.sin(i / RATE * 17)));
    this.buf.thunder = this.mk(th, 0.9);
    n = Math.floor(RATE * 1.4); a = noiseLP(n, 0.1, r); const ig = new Float32Array(n);
    for (let i = 0; i < n; i++) ig[i] = a[i] * Math.min(1, i / (RATE * 0.8)) * (1 - 0.3 * (i / n));
    this.buf.ignite = this.mk(ig, 0.8);
    this.buf.beep = this.mk(toneArr(880, 0.16, 6), 0.5);
    this.buf.beep_go = this.mk(toneArr(1320, 0.5, 3), 0.6);
    this.buf.alarm = this.mk(cat(toneArr(660, 0.18, 2, 1, 1), toneArr(520, 0.18, 2, 1, 1)), 0.4);
    n = Math.floor(RATE * 0.5); a = noiseLP(n, 0.2, r); const sep = new Float32Array(n);
    for (let i = 0; i < n; i++) sep[i] = (a[i] * 1.2 + Math.sin(2 * Math.PI * 70 * i / RATE)) * Math.exp(-i / RATE * 9);
    this.buf.sep = this.mk(sep, 0.9);
    this.buf.click = this.mk(toneArr(1500, 0.04, 60), 0.35);
    n = Math.floor(RATE * 0.5); const hp = new Float32Array(n); let prev = 0;
    for (let i = 0; i < n; i++) { const x = r.uniform(-1, 1) * (0.5 + 0.5 * Math.sin(i / n * Math.PI)); hp[i] = x - prev * 0.9; prev = x; }
    this.buf.hiss = this.mk(hp, 0.5);
    const zap = new Float32Array(Math.floor(RATE * 0.25)); for (let i = 0; i < zap.length; i++) zap[i] = r.uniform(-1, 1) * Math.exp(-i / RATE * 25);
    this.buf.zap = this.mk(zap, 0.9);
    const win = cat(...[523, 659, 784, 1047].map(f => toneArr(f, 0.28, 3)), toneArr(1047, 0.8, 2), new Float32Array(1));
    this.buf.win = this.mk(win, 0.6);
    this.buf.lose = this.mk(cat(toneArr(220, 0.5, 2.5, 1, 1), toneArr(165, 0.9, 2, 1, 1)), 0.4);
  }
  start(name, vol, loop) {
    const src = this.ctx.createBufferSource(), gn = this.ctx.createGain();
    src.buffer = this.buf[name]; src.loop = !!loop; gn.gain.value = vol; src.connect(gn); gn.connect(this.master);
    const ch = { src, gn }; this.active.add(ch);
    src.onended = () => this.active.delete(ch);
    src.start(); return ch;
  }
  play(name, vol = 1) { if (this.ok && !this.muted && this.buf[name]) this.start(name, vol, false); }
  killCh(ch) { if (ch) { try { ch.src.stop(); } catch (e) {} this.active.delete(ch); } }
  toggle_mute() { this.muted = !this.muted; if (this.ok && this.muted) this.stop_all(); }
  stop_all() { for (const ch of [...this.active]) this.killCh(ch); this.eng_ch = this.hiss_ch = null; }
  hold_hiss(on) {
    if (!this.ok || this.muted) return;
    if (on) { if (!this.hiss_ch) this.hiss_ch = this.start('hiss', 0.5, true); }
    else if (this.hiss_ch) { this.killCh(this.hiss_ch); this.hiss_ch = null; }
  }
  process(sim, dt) {
    if (!this.ok || this.muted) return;
    if (sim.status === 'countdown') {
      const n = Math.max(0, Math.ceil(sim.countdown));
      if (n !== this.last_countdown) { this.play(n > 0 ? 'beep' : 'beep_go', 0.8); this.last_countdown = n; }
    }
    if (sim.status !== this.last_status) {
      if (sim.status === 'orbit') this.play('win'); else if (sim.status === 'crashed') this.play('lose');
      this.last_status = sim.status;
    }
    for (const ev of sim.events) {
      if (ev[0] === 'ignite') this.play('ignite', 1.0); else if (ev[0] === 'explosion') this.play('boom', 1.0); else if (ev[0] === 'sep') this.play('sep', 0.9);
    }
    for (const [t, msg, lvl] of sim.log.slice(-4)) {
      const key = Math.round(t * 100) / 100 + '|' + msg;
      if (key !== this._seen && lvl === 'bad' && t >= this.last_log) { this.last_log = t; this._seen = key; this.play('alarm', 0.7); }
    }
    if (sim.status === 'flying' && (sim.faults.nActive() || sim.sep_timer !== null)) {
      this.alarm_t -= dt;
      if (this.alarm_t <= 0) { this.alarm_t = 1.4; this.play('alarm', 0.35); }
    }
    const fl = sim.weather.flash;
    if (fl > 0.95 && this.last_flash <= 0.95) { this.play('zap', 0.7); this.play('thunder', 0.8); }
    this.last_flash = fl;
    const thrust = sim.status === 'flying' && sim.thrust_now()[0] > 0;
    if (thrust) {
      const vol = (0.15 + 0.85 * sim.throttle) * (0.35 + 0.65 * Math.exp(-Math.max(sim.alt, 0) / 25000));
      if (!this.eng_ch) this.eng_ch = this.start('engine', vol, true);
      this.eng_ch.gn.gain.value = vol;
    } else if (this.eng_ch) { this.killCh(this.eng_ch); this.eng_ch = null; }
  }
}

/* ============================================================ bucle principal y eventos */
const snd = new Sounds();
const cfg = defaultConfig();
const builder = new Builder(cfg);
let flight = null, mode = 'builder';

function dispatch(ev) {
  if (mode === 'builder') {
    if (builder.handle(ev) === 'launch') { flight = new FlightScreen(cfg, snd); mode = 'flight'; }
  } else if (flight.handle(ev) === 'builder') { snd.stop_all(); mode = 'builder'; }
}
function toggleFS() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}
document.getElementById('fs').addEventListener('click', e => { toggleFS(); cv.focus(); });

function keyName(e) { if (e.key === ' ') return 'Space'; return e.key.length === 1 ? e.key.toLowerCase() : e.key; }
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'Escape', 'w', 'a', 's', 'd', 'e', 'g', 'c', 'v', 'r', 't', 'x', 'm']);
window.addEventListener('keydown', e => {
  snd.init();
  if (e.altKey && e.key === 'Enter') { toggleFS(); e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey) return;
  const typing = document.activeElement === nameInput;
  const k = keyName(e);
  if (!typing) { if (GAME_KEYS.has(k)) e.preventDefault(); held.add(k); }
  if (e.repeat && !(mode === 'builder' && k.startsWith('Arrow'))) return;
  dispatch({ type: 'keydown', key: k });
});
window.addEventListener('keyup', e => { held.delete(keyName(e)); });
window.addEventListener('blur', () => { held.clear(); mouse.down = false; });
nameInput.addEventListener('input', () => { cfg.name = nameInput.value.toUpperCase().slice(0, 14); nameInput.value = cfg.name; });
nameInput.addEventListener('blur', () => { builder.editing = false; });

function setMouse(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * W / r.width; mouse.y = (e.clientY - r.top) * H / r.height; }
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  snd.init(); setMouse(e); mouse.down = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  dispatch({ type: 'down', pos: [mouse.x, mouse.y] });
  if (!builder.editing) { e.preventDefault(); cv.focus(); }
});
window.addEventListener('pointermove', e => { setMouse(e); dispatch({ type: 'move', pos: [mouse.x, mouse.y] }); });
window.addEventListener('pointerup', e => { setMouse(e); mouse.down = false; dispatch({ type: 'up', pos: [mouse.x, mouse.y] }); });
window.addEventListener('pointercancel', () => { mouse.down = false; dispatch({ type: 'up', pos: [mouse.x, mouse.y] }); });
cv.addEventListener('wheel', e => { e.preventDefault(); dispatch({ type: 'wheel', dy: sgn(e.deltaY) }); }, { passive: false });
cv.addEventListener('mousedown', e => { if (builder.editing) e.preventDefault(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = w * H / W; if (h > vh) { h = vh; w = h * W / H; }
  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(h) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
window.addEventListener('resize', resize); resize();

let last = now();
function frame() {
  const t = now(), dt = Math.min((t - last) / 1000, 0.05); last = t;
  g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  g.lineJoin = 'round';
  try {
    if (mode === 'builder') builder.draw();
    else { flight.update(dt); flight.draw(dt); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__cohetes = { dispatch, held, mouse, snd, cfg, builder, get flight() { return flight; }, get mode() { return mode; } };
